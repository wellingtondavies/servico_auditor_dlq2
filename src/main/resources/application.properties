spring.application.name=servico-auditor-dlq

# AWS
# As credenciais NÃO ficam aqui: o SDK usa a cadeia padrão da AWS
# (variáveis AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, ~/.aws/credentials ou perfil da instância).
aws.sqs.queue.region=${AWS_REGION:us-east-1}

# Nome da DLQ consumida
aws.sqs.queue.entrada-pedido=${DLQ_QUEUE_NAME:T02N_WELLINGTON_DAVIES_DOS_SANTOS-DLQ.fifo}

# Liga/desliga o polling da DLQ (os testes desligam)
auditor.consumer.enabled=${AUDITOR_CONSUMER_ENABLED:true}

# H2 e JPA (desenvolvimento)
spring.datasource.url=jdbc:h2:mem:auditor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Console do H2 acessível só a partir da própria máquina
spring.h2.console.settings.web-allow-others=false
