spring.application.name=servico-auditor-dlq

# Credenciais AWS
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.cloud.aws.region.static=us-east-1

# Nome da fila de entrada de pedidos
aws.sqs.queue.entrada-pedido=T02N_WELLINGTON_DAVIES_DOS_SANTOS-DLQ.fifo

# H2 e JPA (desenvolvimento)
spring.datasource.url=jdbc:h2:mem:auditor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

